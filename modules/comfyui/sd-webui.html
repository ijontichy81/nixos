<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stable Diffusion</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; margin-bottom: 24px; color: #e94560; font-size: 1.5rem; }
.main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 800px) { .main-grid { grid-template-columns: 1fr; } }
.panel { background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #0f3460; }
.panel h2 { font-size: 1rem; margin-bottom: 16px; color: #e94560; }
.form-group { margin-bottom: 12px; }
label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 4px; }
input, select, textarea { width: 100%; padding: 8px 12px; background: #0f3460; border: 1px solid #1a1a4e; border-radius: 6px; color: #eee; font-size: 0.9rem; }
textarea { font-family: monospace; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #e94560; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { width: 100%; padding: 12px; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
.btn:hover { background: #c73650; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
.gallery img { width: 100%; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s; }
.gallery img:hover { border-color: #e94560; }
#progress { margin-top: 12px; padding: 8px; background: #0f3460; border-radius: 6px; text-align: center; font-size: 0.85rem; display: none; }
#error { margin-top: 12px; padding: 8px; background: #2e0a0a; border-radius: 6px; color: #ff6b6b; font-size: 0.85rem; display: none; }
#fullscreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; cursor: pointer; justify-content: center; align-items: center; }
#fullscreen img { max-width: 95vw; max-height: 95vh; border-radius: 8px; }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.tab { padding: 8px 16px; background: #0f3460; border: none; color: #aaa; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 0.85rem; }
.tab.active { background: #16213e; color: #eee; border-bottom: 2px solid #e94560; }
.tab-content { display: none; }
.tab-content.active { display: block; }
</style>
</head>
<body>
<div class="container">
  <h1>Stable Diffusion</h1>
  <div class="main-grid">
    <div class="panel">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('txt2img')">txt2img</button>
        <button class="tab" onclick="switchTab('img2img')">img2img</button>
      </div>

      <div id="txt2img" class="tab-content active">
        <div class="form-group">
          <label for="prompt">Prompt</label>
          <textarea id="prompt" rows="3" placeholder="a cat wearing a hat"></textarea>
        </div>
        <div class="form-group">
          <label for="negative_prompt">Negative Prompt</label>
          <input id="negative_prompt" placeholder="blurry, bad quality">
        </div>
        <div class="row">
          <div class="form-group">
            <label for="steps">Steps</label>
            <input id="steps" type="number" value="20" min="1" max="150">
          </div>
          <div class="form-group">
            <label for="cfg">CFG Scale</label>
            <input id="cfg" type="number" value="7" min="1" max="30" step="0.5">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label for="width">Width</label>
            <select id="width">
              <option>512</option><option>576</option><option>640</option><option>768</option><option>832</option><option>896</option><option selected>1024</option><option>1280</option>
            </select>
          </div>
          <div class="form-group">
            <label for="height">Height</label>
            <select id="height">
              <option>512</option><option>576</option><option>640</option><option>768</option><option>832</option><option>896</option><option selected>1024</option><option>1280</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label for="sampler">Sampler</label>
            <select id="sampler">
              <option>euler</option><option>euler_a</option><option>heun</option><option>dpm2</option><option>dpm++2m</option><option>dpm++2m_v2</option><option>dpm++2s_a</option><option selected>lcm</option>
            </select>
          </div>
          <div class="form-group">
            <label for="seed">Seed (-1 = random)</label>
            <input id="seed" type="number" value="-1">
          </div>
        </div>
      </div>

      <div id="img2img" class="tab-content">
        <div class="form-group">
          <label for="img2img_prompt">Prompt</label>
          <textarea id="img2img_prompt" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="img2img_negative">Negative Prompt</label>
          <input id="img2img_negative">
        </div>
        <div class="form-group">
          <label for="init_image">Initial Image</label>
          <input id="init_image" type="file" accept="image/png,image/jpeg">
        </div>
        <div class="row">
          <div class="form-group">
            <label for="img2img_steps">Steps</label>
            <input id="img2img_steps" type="number" value="20" min="1" max="150">
          </div>
          <div class="form-group">
            <label for="denoise">Denoise</label>
            <input id="denoise" type="number" value="0.75" min="0" max="1" step="0.05">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label for="img2img_width">Width</label>
            <select id="img2img_width"><option>512</option><option>576</option><option>640</option><option>768</option><option>832</option><option>896</option><option selected>1024</option></select>
          </div>
          <div class="form-group">
            <label for="img2img_height">Height</label>
            <select id="img2img_height"><option>512</option><option>576</option><option>640</option><option>768</option><option>832</option><option>896</option><option selected>1024</option></select>
          </div>
        </div>
      </div>

      <button class="btn" id="generateBtn" onclick="generate()">Generate</button>
      <div id="progress"></div>
      <div id="error"></div>
    </div>

    <div class="panel">
      <h2>Output</h2>
      <div id="output"><p style="color:#666;font-size:0.85rem">Generated images will appear here.</p></div>
      <div class="gallery" id="gallery"></div>
    </div>
  </div>
</div>

<div id="fullscreen" onclick="closeFullscreen()"><img id="fullscreenImg"></div>

<script>
const API = '';
let generations = [];

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[onclick*="${name}"]`).classList.add('active');
  document.getElementById(name).classList.add('active');
}

async function generate() {
  const isTxt2img = document.getElementById('txt2img').classList.contains('active');
  const btn = document.getElementById('generateBtn');
  const progress = document.getElementById('progress');
  const error = document.getElementById('error');

  btn.disabled = true;
  error.style.display = 'none';
  progress.style.display = 'block';
  progress.textContent = 'Generating...';

  const prompt = isTxt2img
    ? document.getElementById('prompt').value
    : document.getElementById('img2img_prompt').value;
  const negative = isTxt2img
    ? document.getElementById('negative_prompt').value
    : document.getElementById('img2img_negative').value;
  const steps = parseInt(isTxt2img
    ? document.getElementById('steps').value
    : document.getElementById('img2img_steps').value);
  const width = parseInt(isTxt2img
    ? document.getElementById('width').value
    : document.getElementById('img2img_width').value);
  const height = parseInt(isTxt2img
    ? document.getElementById('height').value
    : document.getElementById('img2img_height').value);
  const seed = parseInt(document.getElementById('seed').value);
  const cfg = parseFloat(document.getElementById('cfg').value);
  const sampler = document.getElementById('sampler').value;

  const body = {
    model: "sd-cpp-local",
    prompt: prompt,
    negative_prompt: negative || undefined,
    steps: steps,
    width: width,
    height: height,
    seed: seed >= 0 ? seed : undefined,
    cfg_scale: cfg,
    sampler_name: sampler,
    n: 1,
    response_format: "b64_json"
  };

  if (!isTxt2img) {
    const fileInput = document.getElementById('init_image');
    if (fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = async function(e) {
        body.init_image = e.target.result.split(',')[1];
        body.denoising_strength = parseFloat(document.getElementById('denoise').value);
        await doGenerate(body, btn, progress, error);
      };
      reader.readAsDataURL(fileInput.files[0]);
      return;
    }
  }

  await doGenerate(body, btn, progress, error);
}

async function doGenerate(body, btn, progress, error) {
  try {
    const res = await fetch(API + '/v1/images/generations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(err || `HTTP ${res.status}`);
    }

    const data = await res.json();
    progress.style.display = 'none';

    const gallery = document.getElementById('gallery');
    const output = document.getElementById('output');
    output.innerHTML = '';

    for (const img of data.data) {
      const wrapper = document.createElement('div');
      const el = document.createElement('img');
      el.src = `data:image/png;base64,${img.b64_json}`;
      el.onclick = () => openFullscreen(el.src);
      wrapper.appendChild(el);
      gallery.prepend(wrapper);
    }
  } catch (e) {
    error.textContent = 'Error: ' + e.message;
    error.style.display = 'block';
    progress.style.display = 'none';
  } finally {
    btn.disabled = false;
  }
}

function openFullscreen(src) {
  document.getElementById('fullscreen').style.display = 'flex';
  document.getElementById('fullscreenImg').src = src;
}

function closeFullscreen() {
  document.getElementById('fullscreen').style.display = 'none';
}
</script>
</body>
</html>
